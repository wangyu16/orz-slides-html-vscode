119.75 19.63Q122.31 17.31 126.94 15.88Q131.56 14.44 137.31 14.44L137.31 14.44Q142.06 14.44 147.31 15.56L147.31 15.56Q150.56 16.19 152.81 19.69Q155.06 23.19 155.06 27.44L155.06 27.44Q155.06 31.19 152.75 35.31Q150.44 39.44 145.94 45.56L145.94 45.56L152.06 45.56Q156.81 45.56 158.38 46.06Q159.94 46.56 159.94 48.06L159.94 48.06Q159.94 49.31 159.13 50.19Q158.31 51.06 157.44 51.06L157.44 51.06L140.19 51.06Q134.06 57.94 130.81 63.25Q127.56 68.56 128.19 70.81L128.19 70.81Q128.69 73.19 135.94 74.06L135.94 74.06Q144.06 74.06 149.69 72.13Q155.31 70.19 160.56 66.19L160.56 66.19Z" fill="black" stroke="black" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" id="text2" />
    </mask>
  </defs>

  <!-- Projector Tripod -->
  <g stroke="#6c757d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 128 170 L 128 238" />
    <path d="M 128 206 L 62 246" />
    <path d="M 128 206 L 194 246" />
  </g>

  <!-- Screen background / Shadow -->
  <rect x="24" y="32" width="208" height="156" fill="#e9ecef" filter="url(#shadow)" rx="4" />

  <!-- Roller Tube -->
  <rect x="16" y="20" width="224" height="20" rx="4" fill="#495057" />
  <rect x="16" y="22" width="224" height="6" fill="#6c757d" opacity="0.4"/>

  <!-- Roller End Caps -->
  <circle cx="16" cy="30" r="10" fill="#343a40" />
  <circle cx="240" cy="30" r="10" fill="#343a40" />

  <!-- Screen Fabric -->
  <rect x="24" y="40" width="208" height="144" fill="#ffffff" />
  
  <!-- Editor Sidebar -->
  <rect x="24" y="40" width="48" height="144" fill="#f8f9fa" />
  <path d="M 72 40 L 72 184" stroke="#dee2e6" stroke-width="2"/>

  <!-- Thumbnails in Sidebar -->
  <!-- Active Thumbnail -->
  <rect x="32" y="50" width="32" height="22" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1.5" />
  <text x="48" y="65" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#155724" text-anchor="middle">&lt;/&gt;</text>
  
  <!-- Inactive Thumbnails -->
  <rect x="32" y="82" width="32" height="22" rx="2" fill="#e9ecef" stroke="#ced4da" stroke-width="1" />
  <rect x="36" y="86" width="24" height="3" rx="1.5" fill="#adb5bd" />
  <rect x="36" y="91" width="16" height="3" rx="1.5" fill="#adb5bd" />

  <rect x="32" y="114" width="32" height="22" rx="2" fill="#e9ecef" stroke="#ced4da" stroke-width="1" />
  <rect x="36" y="118" width="20" height="8" rx="1.5" fill="#adb5bd" />

  <!-- App Progress / Scroll bar equivalent -->
  <rect x="24" y="180" width="208" height="4" fill="#dee2e6" />
  <rect x="24" y="180" width="80" height="4" fill="#28a745" />

  <!-- Bottom Bar of Roller Screen -->
  <rect x="20" y="184" width="216" height="10" rx="5" fill="#495057" />

  <!-- HTML Elements on Main Screen -->
  <text x="86" y="60" font-family="'Courier New', monospace" font-size="10" fill="#ced4da">&lt;div class="slide"&gt;</text>
  <text x="86" y="166" font-family="'Courier New', monospace" font-size="10" fill="#ced4da">&lt;/div&gt;</text>
  
  <rect x="210" y="156" width="2" height="12" fill="#28a745" opacity="0.8">
    <!-- Using a simple static opacity to avoid SVG animation warnings in VS code -->
  </rect>

  <!-- Title Placeholder -->
  <rect x="86" y="68" width="60" height="4" rx="2" fill="#e9ecef" />
  <rect x="86" y="76" width="40" height="4" rx="2" fill="#e9ecef" />

  <!-- ORZ Logo in Main Slide -->
  <!-- Shifted further right to fit beside tags -->
  <g transform="translate(86, 80) scale(0.65)">
    <g filter="url(#rough-edges)">
      <use href="#seal-shape" fill="#96d969" mask="url(#text-cutout-ancient)" id="rect2" />
      <use href="#seal-shape" fill="#6ea84d" opacity="0.28" filter="url(#stone-texture)" mask="url(#text-cutout-ancient)" id="stone-grain" />
      <use href="#seal-shape" fill="none" stroke="#c8f7a5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.42" mask="url(#text-cutout-ancient)" id="seal-highlight" />
      <use href="#seal-shape" fill="none" stroke="#5f8f44" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.35" mask="url(#text-cutout-ancient)" id="seal-shadow" />
    </g>
  </g>

</svg>
